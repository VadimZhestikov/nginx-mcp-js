load_module modules/ngx_http_js_module.so;
load_module modules/ngx_otel_module.so;

error_log /var/log/nginx/error.log info;

events {
}

http {
    access_log off;

    # Docker embedded DNS, needed by ngx.fetch to reach Grafana by name
    resolver 127.0.0.11 ipv6=off;

    js_path "/etc/nginx";
    js_import main from mcp.js;
    js_import ctrl from mcp_control.js;

    js_shared_dict_zone zone=mcp_clients:1M timeout=365d evict;
    js_shared_dict_zone zone=mcp_servers:1M timeout=365d evict;
    js_shared_dict_zone zone=mcp_routes:1M timeout=1h evict;
    js_shared_dict_zone zone=mcp_policy:64k;
    js_shared_dict_zone zone=mcp_stats:1M type=number;
    js_shared_dict_zone zone=mcp_gauges:1M type=number;

    js_var $mcp_upstream "";
    js_var $mcp_rl_decision "";

    otel_exporter {
        endpoint otel-collector:4317;
    }

    server {
        listen 9000;

        otel_trace on;

        js_set $mcp_tool main.mcp_tool_name;
        js_set $mcp_status main.mcp_tool_status;
        js_set $mcp_client main.mcp_client_name;
        js_set $mcp_server main.mcp_server_name;

        otel_span_attr "mcp.tool.name" $mcp_tool;
        otel_span_attr "mcp.tool.status" $mcp_status;
        otel_span_attr "mcp.client.name" $mcp_client;
        otel_span_attr "mcp.server.name" $mcp_server;
        otel_span_attr "mcp.upstream.selected" $mcp_upstream;
        otel_span_attr "mcp.ratelimit.decision" $mcp_rl_decision;

        # Rate-limit + routing gate; forwards to /route/* when allowed
        location /mcp-stable {
            js_content ctrl.mcp_gate;
        }

        location /mcp-flaky {
            js_content ctrl.mcp_gate;
        }

        location /mcp-sluggish {
            js_content ctrl.mcp_gate;
        }

        location /route/mcp-stable {
            internal;
            js_header_filter ctrl.header_filter;
            js_body_filter ctrl.response_filter;
            proxy_pass http://mcp-stable:9001/mcp;
        }

        location /route/mcp-flaky {
            internal;
            js_header_filter ctrl.header_filter;
            js_body_filter ctrl.response_filter;
            proxy_pass http://mcp-flaky:9002/mcp;
        }

        location /route/mcp-sluggish {
            internal;
            js_header_filter ctrl.header_filter;
            js_body_filter ctrl.response_filter;
            proxy_pass http://mcp-sluggish:9003/mcp;
        }
    }

    # Control plane: adaptive-limit controller, metrics, policy API
    server {
        listen 9100;

        location = /metrics {
            js_content ctrl.metrics;
        }

        location = /policy {
            js_content ctrl.control;
        }

        location @controller {
            js_periodic ctrl.tick interval=1s;
        }
    }
}
